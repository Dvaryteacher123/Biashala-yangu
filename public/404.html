<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Dvary Business</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #0f172a;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.3s;
            background: #f8fafc;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
            transform: scale(1.01);
        }
        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .msg.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .msg.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .extra-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
        .extra-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Dvary<span>Business</span></div>
        <p class="subtitle">Weka upya nenosiri lako</p>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">Barua Pepe (Email)</label>
                <input type="email" id="email" placeholder="mfano@email.com" required />
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">📧 Tuma Kiungo cha Kuweka Upya</button>
        </form>

        <div id="messageBox" class="msg"></div>

        <div class="extra-links">
            <p><a href="/auth/login.html">← Rudi kwenye Login</a></p>
        </div>
    </div>

    <script type="module">
        import { supabase } from '/assets/js/supabase.js';

        const form = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const msg = document.getElementById('messageBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.style.display = 'none';

            const email = emailInput.value.trim();

            if (!email) {
                msg.className = 'msg error';
                msg.textContent = 'Tafadhali ingiza barua pepe yako.';
                msg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Inatuma...';

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/auth/login.html'
                });

                if (error) throw error;

                msg.className = 'msg success';
                msg.textContent = '✅ Kiungo cha kuweka upya nenosiri kimetumwa kwenye barua pepe yako. Angalia inbox yako.';
                msg.style.display = 'block';
                form.reset();

            } catch (err) {
                console.error('Reset error:', err);
                msg.className = 'msg error';
                msg.textContent = err.message || 'Kuna tatizo la kutuma kiungo. Jaribu tena.';
                msg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📧 Tuma Kiungo cha Kuweka Upya';
            }
        });
    </script>
</body>
</html>
