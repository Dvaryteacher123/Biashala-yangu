<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Detail - Dvary Business</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --blue-light: #eff6ff;
            --dark: #0f172a;
            --text: #475569;
            --muted: #64748b;
            --border: #e2e8f0;
            --bg: #f1f5f9;
            --white: #ffffff;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(37,99,235,0.08), transparent 35%),
                linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--dark);
        }

        /* ================= NAVIGATION ================= */

        nav {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);
            padding: 16px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 25px rgba(15,23,42,0.07);
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            color: var(--dark);
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            padding: 9px 13px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
            background: var(--blue-light);
        }

        .btn-outline {
            border: 2px solid var(--primary);
            padding: 9px 20px !important;
            border-radius: 30px !important;
            color: var(--primary) !important;
        }

        .btn-outline:hover {
            background: var(--primary) !important;
            color: white !important;
        }

        .btn-primary-nav {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            padding: 10px 22px !important;
            border-radius: 30px !important;
            color: white !important;
            box-shadow: 0 5px 15px rgba(37,99,235,0.25);
        }

        .btn-primary-nav:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary)) !important;
            transform: translateY(-2px);
            color: white !important;
        }

        /* ================= MAIN ================= */

        .main-content {
            flex: 1;
            padding: 45px 25px 70px;
            max-width: 1150px;
            margin: 0 auto;
            width: 100%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 25px;
            padding: 10px 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(15,23,42,0.06);
            transition: 0.3s;
        }

        .back-link:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 25px rgba(37,99,235,0.12);
        }

        /* ================= BIG BUSINESS CARD ================= */

        .business-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(226,232,240,0.8);
            box-shadow:
                0 20px 60px rgba(15,23,42,0.10),
                0 5px 20px rgba(37,99,235,0.05);
            margin-bottom: 35px;
            transition: 0.4s ease;
        }

        .business-card:hover {
            box-shadow:
                0 25px 75px rgba(15,23,42,0.14),
                0 8px 30px rgba(37,99,235,0.08);
        }

        /* ================= BIG IMAGE ================= */

        .business-cover {
            width: 100%;
            height: 430px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(135deg, #dbeafe, #eff6ff);
        }

        .business-cover img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .business-card:hover .business-cover img {
            transform: scale(1.04);
        }

        .business-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 110px;
            background:
                radial-gradient(circle at center, #dbeafe, #eff6ff 50%, #f8fafc);
        }

        /* IMAGE OVERLAY */

        .business-cover::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to bottom,
                    transparent 45%,
                    rgba(15,23,42,0.72) 100%
                );
            pointer-events: none;
        }

        .cover-badge {
            position: absolute;
            top: 22px;
            right: 22px;
            z-index: 2;
        }

        .badge-pro {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            color: white;
            font-size: 13px;
            padding: 9px 18px;
            border-radius: 30px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(37,99,235,0.35);
        }

        /* ================= BUSINESS INFO ================= */

        .business-content {
            padding: 38px 42px 42px;
        }

        .business-header {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            margin-bottom: 28px;
        }

        .business-info {
            width: 100%;
        }

        .business-info .name {
            font-size: 38px;
            line-height: 1.15;
            font-weight: 900;
            color: var(--dark);
            letter-spacing: -1px;
        }

        .business-info .category {
            display: inline-flex;
            align-items: center;
            margin-top: 12px;
            padding: 8px 15px;
            border-radius: 30px;
            background: var(--blue-light);
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
        }

        .business-info .description {
            color: var(--text);
            margin-top: 20px;
            line-height: 1.8;
            font-size: 16px;
            max-width: 900px;
        }

        /* ================= META ================= */

        .business-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .business-meta .meta-item {
            min-height: 70px;
            display: flex;
            align-items: center;
            gap: 13px;
            color: var(--text);
            font-size: 14px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 15px;
            transition: 0.3s;
        }

        .business-meta .meta-item:hover {
            background: var(--blue-light);
            transform: translateY(-2px);
        }

        .business-meta .meta-item .icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 12px;
            font-size: 20px;
            box-shadow: 0 3px 10px rgba(15,23,42,0.06);
        }

        .business-meta .meta-item a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            word-break: break-word;
        }

        .business-meta .meta-item a:hover {
            text-decoration: underline;
        }

        /* ================= STATS ================= */

        .business-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .business-stats .stat {
            text-align: center;
            padding: 22px;
            background: linear-gradient(145deg, #f8fafc, #eef4ff);
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }

        .business-stats .stat:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(37,99,235,0.10);
        }

        .business-stats .stat .number {
            font-size: 30px;
            font-weight: 900;
            color: var(--dark);
        }

        .business-stats .stat .label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            margin-top: 5px;
        }

        /* ================= REVIEWS ================= */

        .reviews-section {
            background: white;
            border-radius: 28px;
            padding: 35px 40px;
            border: 1px solid rgba(226,232,240,0.8);
            box-shadow: 0 15px 45px rgba(15,23,42,0.07);
        }

        .reviews-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .reviews-section .section-header h2 {
            font-size: 25px;
            color: var(--dark);
            font-weight: 800;
        }

        .reviews-section .section-header .avg-rating {
            font-size: 17px;
            color: #eab308;
            font-weight: 800;
            background: #fefce8;
            padding: 10px 16px;
            border-radius: 30px;
        }

        /* ================= REVIEW ITEM ================= */

        .review-item {
            padding: 22px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-item .review-header {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .review-item .review-user {
            font-weight: 800;
            color: var(--dark);
        }

        .review-item .review-stars {
            color: #eab308;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .review-item .review-date {
            color: #94a3b8;
            font-size: 12px;
        }

        .review-item .review-comment {
            color: var(--text);
            margin-top: 9px;
            font-size: 14px;
            line-height: 1.7;
        }

        /* ================= EMPTY ================= */

        .empty-reviews {
            text-align: center;
            padding: 45px 20px;
            color: var(--muted);
        }

        .empty-reviews .icon {
            font-size: 50px;
            margin-bottom: 12px;
        }

        /* ================= REVIEW FORM ================= */

        .review-form {
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(145deg, #f8fafc, #eff6ff);
            border: 1px solid #dbeafe;
        }

        .review-form h3 {
            font-size: 20px;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: var(--dark);
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #dbe3ee;
            border-radius: 13px;
            font-size: 14px;
            transition: 0.3s;
            background: white;
            outline: none;
            font-family: inherit;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.10);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-group select {
            max-width: 230px;
        }

        .btn-submit-review {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            padding: 13px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 7px 18px rgba(37,99,235,0.20);
        }

        .btn-submit-review:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37,99,235,0.28);
        }

        .btn-submit-review:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ================= MESSAGES ================= */

        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }

        .msg.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .msg.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .msg.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        /* ================= LOADING ================= */

        .loading-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--muted);
            font-size: 16px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(15,23,42,0.06);
        }

        /* ================= FOOTER ================= */

        footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 35px 20px;
            margin-top: auto;
        }

        footer p {
            margin: 6px 0;
        }

        footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 10px;
            transition: 0.3s;
        }

        footer a:hover {
            color: white;
        }

        /* ================= TABLET ================= */

        @media (max-width: 900px) {

            nav {
                padding: 15px 25px;
            }

            .main-content {
                padding: 30px 18px 55px;
            }

            .business-cover {
                height: 360px;
            }

            .business-content {
                padding: 30px;
            }

            .business-info .name {
                font-size: 32px;
            }

            .business-meta {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                padding: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .nav-links {
                justify-content: center;
                gap: 5px;
            }

            .nav-links a {
                font-size: 13px;
                padding: 7px 9px;
            }

            .btn-outline,
            .btn-primary-nav {
                padding: 8px 13px !important;
            }

            .main-content {
                padding: 20px 12px 45px;
            }

            .back-link {
                margin-bottom: 18px;
                font-size: 14px;
            }

            .business-card {
                border-radius: 22px;
            }

            /* IMAGE KUBWA KWENYE SIMU */

            .business-cover {
                height: 300px;
            }

            .business-image-placeholder {
                font-size: 80px;
            }

            .cover-badge {
                top: 15px;
                right: 15px;
            }

            .badge-pro {
                font-size: 11px;
                padding: 8px 14px;
            }

            .business-content {
                padding: 25px 18px 25px;
            }

            .business-header {
                margin-bottom: 20px;
            }

            .business-info .name {
                font-size: 27px;
                letter-spacing: -0.5px;
            }

            .business-info .category {
                font-size: 13px;
                margin-top: 10px;
            }

            .business-info .description {
                font-size: 14px;
                line-height: 1.7;
                margin-top: 15px;
            }

            .business-meta {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-top: 20px;
                padding-top: 20px;
            }

            .business-meta .meta-item {
                min-height: 60px;
            }

            .business-stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 20px;
                padding-top: 20px;
            }

            .business-stats .stat {
                padding: 18px 10px;
            }

            .business-stats .stat .number {
                font-size: 25px;
            }

            .reviews-section {
                border-radius: 22px;
                padding: 22px 17px;
            }

            .reviews-section .section-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .reviews-section .section-header h2 {
                font-size: 21px;
            }

            .review-form {
                padding: 20px 15px;
            }

            .form-group select {
                max-width: 100%;
            }
        }

        /* ================= SMALL PHONES ================= */

        @media (max-width: 380px) {

            .nav-links a:nth-child(3),
            .nav-links a:nth-child(4) {
                display: none;
            }

            .business-cover {
                height: 250px;
            }

            .business-info .name {
                font-size: 24px;
            }

            .business-stats .stat .number {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <nav>
        <div class="logo">Dvary<span>Business</span></div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/categories.html">Categories</a>
            <a href="/about.html">About</a>
            <a href="/contact.html">Contact</a>
            <a href="/auth/login.html" class="btn-outline">Log In</a>
            <a href="/auth/signup.html" class="btn-primary-nav">Sign Up</a>
        </div>
    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <a href="/categories.html" class="back-link">
            ← Rudi kwenye Categories
        </a>

        <!-- BUSINESS DETAIL -->

        <div id="businessDetail">
            <div class="loading-state">
                ⏳ Inapakia maelezo ya biashara...
            </div>
        </div>


        <!-- ================= REVIEWS ================= -->

        <div id="reviewsSection" class="reviews-section" style="display:none;">

            <div class="section-header">
                <h2>⭐ Reviews za Wateja</h2>

                <div class="avg-rating" id="avgRating">
                    0.0 ⭐
                </div>
            </div>


            <div id="reviewsList">

                <div class="empty-reviews">
                    <div class="icon">📝</div>
                    <p>
                        Hakuna reviews bado.
                        Kuwa wa kwanza kuandika review!
                    </p>
                </div>

            </div>


            <!-- REVIEW FORM -->

            <div class="review-form" id="reviewFormContainer">

                <h3>✍️ Andika Review</h3>

                <form id="reviewForm">

                    <div class="form-group">

                        <label for="rating">
                            Rating
                            <span style="color:#b91c1c;">*</span>
                        </label>

                        <select id="rating" required>

                            <option value="">
                                -- Chagua Rating --
                            </option>

                            <option value="5">
                                ⭐⭐⭐⭐⭐ (5)
                            </option>

                            <option value="4">
                                ⭐⭐⭐⭐ (4)
                            </option>

                            <option value="3">
                                ⭐⭐⭐ (3)
                            </option>

                            <option value="2">
                                ⭐⭐ (2)
                            </option>

                            <option value="1">
                                ⭐ (1)
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="comment">
                            Maoni yako
                        </label>

                        <textarea
                            id="comment"
                            placeholder="Andika maoni yako kuhusu biashara hii..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn-submit-review"
                        id="submitReviewBtn"
                    >
                        📤 Tuma Review
                    </button>


                    <div
                        id="reviewMessage"
                        class="msg"
                    ></div>

                </form>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Dvary Business. All rights reserved.
        </p>

        <p>
            <a href="/privacy.html">Privacy</a> |
            <a href="/terms.html">Terms</a> |
            <a href="/contact.html">Contact</a>
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script type="module">

        import { supabase }
        from '/assets/js/supabase.js';


        /* ================= ELEMENTS ================= */

        const businessDetail =
            document.getElementById('businessDetail');

        const reviewsSection =
            document.getElementById('reviewsSection');

        const reviewsList =
            document.getElementById('reviewsList');

        const avgRatingEl =
            document.getElementById('avgRating');

        const reviewForm =
            document.getElementById('reviewForm');

        const ratingInput =
            document.getElementById('rating');

        const commentInput =
            document.getElementById('comment');

        const submitReviewBtn =
            document.getElementById('submitReviewBtn');

        const reviewMessage =
            document.getElementById('reviewMessage');


        let currentBusiness = null;
        let currentUser = null;


        /* ================= GET BUSINESS ID ================= */

        function getBusinessIdFromUrl() {

            const params =
                new URLSearchParams(window.location.search);

            return params.get('id');
        }


        /* ================= CHECK SESSION ================= */

        async function checkSession() {

            const {
                data: { session },
                error
            } = await supabase.auth.getSession();

            if (error || !session) {
                return null;
            }

            return session.user;
        }


        /* ================= LOAD BUSINESS ================= */

        async function loadBusiness(businessId) {

            try {

                const {
                    data,
                    error
                } = await supabase
                    .from('businesses')
                    .select('*')
                    .eq('id', businessId)
                    .single();

                if (error) throw error;

                return data;

            } catch (err) {

                console.error(
                    'Error loading business:',
                    err
                );

                return null;
            }
        }


        /* ================= LOAD REVIEWS ================= */

        async function loadReviews(businessId) {

            try {

                const {
                    data,
                    error
                } = await supabase
                    .from('reviews')
                    .select('*')
                    .eq('business_id', businessId)
                    .eq('status', 'approved')
                    .order('created_at', {
                        ascending: false
                    });

                if (error) throw error;

                return data || [];

            } catch (err) {

                console.error(
                    'Error loading reviews:',
                    err
                );

                return [];
            }
        }


        /* ================= RENDER BUSINESS ================= */

        function renderBusiness(business) {

            const imageHtml = business.image_url

                ? `
                    <img
                        src="${business.image_url}"
                        alt="${business.name}"
                        loading="lazy"
                    />
                `

                : `
                    <div class="business-image-placeholder">
                        🏢
                    </div>
                `;


            const proBadge = business.is_pro

                ? `
                    <span class="badge-pro">
                        ⭐ PRO+
                    </span>
                `

                : '';


            businessDetail.innerHTML = `

                <div class="business-card">

                    <!-- BIG IMAGE -->

                    <div class="business-cover">

                        ${imageHtml}

                        ${
                            business.is_pro
                            ? `
                                <div class="cover-badge">
                                    ${proBadge}
                                </div>
                            `
                            : ''
                        }

                    </div>


                    <!-- CONTENT -->

                    <div class="business-content">

                        <div class="business-header">

                            <div class="business-info">

                                <div class="name">
                                    ${business.name}
                                </div>


                                <div class="category">
                                    📂
                                    ${business.category || 'Nyingine'}
                                </div>


                                <div class="description">
                                    ${
                                        business.description ||
                                        'Hakuna maelezo ya biashara hii.'
                                    }
                                </div>

                            </div>

                        </div>


                        <!-- META INFORMATION -->

                        <div class="business-meta">

                            ${
                                business.address
                                ? `
                                    <div class="meta-item">

                                        <span class="icon">
                                            📍
                                        </span>

                                        <span>
                                            ${business.address}
                                        </span>

                                    </div>
                                `
                                : ''
                            }


                            ${
                                business.phone
                                ? `
                                    <div class="meta-item">

                                        <span class="icon">
                                            📞
                                        </span>

                                        <a
                                            href="tel:${business.phone}"
                                        >
                                            ${business.phone}
                                        </a>

                                    </div>
                                `
                                : ''
                            }


                            ${
                                business.website
                                ? `
                                    <div class="meta-item">

                                        <span class="icon">
                                            🌐
                                        </span>

                                        <a
                                            href="${business.website}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            Website
                                        </a>

                                    </div>
                                `
                                : ''
                            }

                        </div>


                        <!-- STATS -->

                        <div class="business-stats">

                            <div class="stat">

                                <div class="number">
                                    ${business.views || 0}
                                </div>

                                <div class="label">
                                    👁️ Views
                                </div>

                            </div>


                            <div class="stat">

                                <div class="number">
                                    ${business.likes || 0}
                                </div>

                                <div class="label">
                                    ❤️ Likes
                                </div>

                            </div>

                        </div>

                    </div>

                </div>
            `;


            /* UPDATE VIEWS */

            updateViews(
                business.id,
                (business.views || 0) + 1
            );
        }


        /* ================= UPDATE VIEWS ================= */

        async function updateViews(
            businessId,
            newViews
        ) {

            try {

                await supabase
                    .from('businesses')
                    .update({
                        views: newViews
                    })
                    .eq('id', businessId);

            } catch (err) {

                console.error(
                    'Error updating views:',
                    err
                );
            }
        }


        /* ================= RENDER REVIEWS ================= */

        function renderReviews(reviews) {

            if (
                !reviews ||
                reviews.length === 0
            ) {

                reviewsList.innerHTML = `

                    <div class="empty-reviews">

                        <div class="icon">
                            📝
                        </div>

                        <p>
                            Hakuna reviews bado.
                            Kuwa wa kwanza kuandika review!
                        </p>

                    </div>
                `;

                avgRatingEl.textContent =
                    '0.0 ⭐';

                return;
            }


            const total =
                reviews.length;


            const sum =
                reviews.reduce(
                    (acc, r) =>
                        acc + Number(r.rating),
                    0
                );


            const avg =
                (sum / total).toFixed(1);


            avgRatingEl.textContent =
                `${avg} ⭐ (${total} reviews)`;


            let html = '';


            reviews.forEach(review => {

                const stars =
                    '⭐'.repeat(review.rating) +
                    '☆'.repeat(5 - review.rating);


                const date =
                    review.created_at
                    ? new Date(
                        review.created_at
                    ).toLocaleDateString('sw-TZ')
                    : '—';


                html += `

                    <div class="review-item">

                        <div class="review-header">

                            <span class="review-user">
                                ${review.user_name || 'Mteja'}
                            </span>

                            <span class="review-stars">
                                ${stars}
                            </span>

                            <span class="review-date">
                                ${date}
                            </span>

                        </div>


                        <div class="review-comment">

                            ${
                                review.comment ||
                                'Hakuna maoni.'
                            }

                        </div>

                    </div>
                `;
            });


            reviewsList.innerHTML = html;
        }


        /* ================= SUBMIT REVIEW ================= */

        reviewForm.addEventListener(
            'submit',
            async (e) => {

                e.preventDefault();

                reviewMessage.style.display =
                    'none';


                /* CHECK LOGIN */

                if (!currentUser) {

                    reviewMessage.className =
                        'msg info';

                    reviewMessage.textContent =
                        '🔐 Tafadhali ingia kwanza ili kuweza kuandika review.';

                    reviewMessage.style.display =
                        'block';


                    setTimeout(() => {

                        window.location.href =
                            '/auth/login.html';

                    }, 2000);

                    return;
                }


                const rating =
                    parseInt(
                        ratingInput.value
                    );


                const comment =
                    commentInput.value.trim();


                if (!rating) {

                    reviewMessage.className =
                        'msg error';

                    reviewMessage.textContent =
                        'Tafadhali chagua rating.';

                    reviewMessage.style.display =
                        'block';

                    return;
                }


                submitReviewBtn.disabled =
                    true;

                submitReviewBtn.textContent =
                    '⏳ Inatuma...';


                try {

                    /* GET USER NAME */

                    const {
                        data: userData
                    } = await supabase
                        .from('users')
                        .select('full_name')
                        .eq('id', currentUser.id)
                        .single();


                    const userName =
                        userData?.full_name ||
                        currentUser.email ||
                        'Mteja';


                    /* INSERT REVIEW */

                    const {
                        error
                    } = await supabase
                        .from('reviews')
                        .insert([{

                            business_id:
                                currentBusiness.id,

                            user_id:
                                currentUser.id,

                            user_name:
                                userName,

                            rating:
                                rating,

                            comment:
                                comment || '',

                            status:
                                'pending',

                            created_at:
                                new Date().toISOString()

                        }]);


                    if (error)
                        throw error;


                    reviewMessage.className =
                        'msg success';

                    reviewMessage.textContent =
                        '✅ Review imetumwa! Inasubiri kuidhinishwa na Admin.';

                    reviewMessage.style.display =
                        'block';


                    ratingInput.value =
                        '';

                    commentInput.value =
                        '';


                    setTimeout(
                        async () => {

                            const reviews =
                                await loadReviews(
                                    currentBusiness.id
                                );

                            renderReviews(
                                reviews
                            );

                        },
                        1500
                    );


                } catch (err) {

                    console.error(
                        'Submit review error:',
                        err
                    );


                    reviewMessage.className =
                        'msg error';

                    reviewMessage.textContent =
                        'Kuna tatizo la kutuma review. Jaribu tena.';

                    reviewMessage.style.display =
                        'block';

                } finally {

                    submitReviewBtn.disabled =
                        false;

                    submitReviewBtn.textContent =
                        '📤 Tuma Review';
                }

            }
        );


        /* ================= INIT ================= */

        async function initBusinessDetail() {

            /* GET ID */

            const businessId =
                getBusinessIdFromUrl();


            if (!businessId) {

                businessDetail.innerHTML = `

                    <div class="loading-state"
                         style="color:#b91c1c;">

                        ⚠️ Hakuna ID ya biashara
                        iliyotolewa.

                        <br><br>

                        <a
                            href="/categories.html"
                            style="color:#2563eb;"
                        >
                            Rudi kwenye Categories
                        </a>

                    </div>
                `;

                return;
            }


            /* LOAD BUSINESS */

            const business =
                await loadBusiness(
                    businessId
                );


            if (!business) {

                businessDetail.innerHTML = `

                    <div class="loading-state"
                         style="color:#b91c1c;">

                        ⚠️ Biashara
                        haikupatikana.

                        <br><br>

                        <a
                            href="/categories.html"
                            style="color:#2563eb;"
                        >
                            Rudi kwenye Categories
                        </a>

                    </div>
                `;

                return;
            }


            currentBusiness =
                business;


            /* CHECK SESSION */

            currentUser =
                await checkSession();


            /* RENDER BUSINESS */

            renderBusiness(
                business
            );


            /* LOAD REVIEWS */

            const reviews =
                await loadReviews(
                    businessId
                );


            renderReviews(
                reviews
            );


            /* SHOW REVIEWS */

            reviewsSection.style.display =
                'block';


            /* USER NOT LOGGED IN */

            if (!currentUser) {

                document
                    .querySelector(
                        '.review-form h3'
                    )
                    .textContent =
                    '🔐 Ingia kuandika review';


                submitReviewBtn.disabled =
                    true;


                submitReviewBtn.textContent =
                    '🔐 Ingia Kwanza';


                submitReviewBtn.style.cursor =
                    'not-allowed';

            }

            /* USER LOGGED IN */

            else {

                document
                    .querySelector(
                        '.review-form h3'
                    )
                    .textContent =
                    '✍️ Andika Review';


                submitReviewBtn.disabled =
                    false;


                submitReviewBtn.textContent =
                    '📤 Tuma Review';


                submitReviewBtn.style.cursor =
                    'pointer';
            }

        }


        /* START */

        initBusinessDetail();

    </script>

</body>
  </html>
