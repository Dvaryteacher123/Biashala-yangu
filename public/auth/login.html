<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Dvary Business</title>
  
  <style>
    /* ===== CSS ZOTE ZA LOGIN ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2ff 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 40px 35px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .logo span {
      color: #2563eb;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #0f172a;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      transition: 0.3s;
      background: #f8fafc;
      outline: none;
    }
    .form-group input:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #1d4ed8;
      transform: scale(1.01);
    }
    .btn-login:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
    .msg.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .msg.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .extra-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }
    .extra-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">Dvary<span>Business</span></div>
    <p class="subtitle">Ingia kwenye akaunti yako</p>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Barua Pepe (Email)</label>
        <input type="email" id="email" placeholder="mfano@email.com" required />
      </div>

      <div class="form-group">
        <label for="password">Nenosiri</label>
        <input type="password" id="password" placeholder="Ingiza nenosiri" required />
      </div>

      <button type="submit" class="btn-login" id="loginBtn">🔑 Ingia</button>
    </form>

    <!-- MESSAGE BOX -->
    <div id="messageBox" class="msg"></div>

    <div class="extra-links">
      <p>Huna akaunti? <a href="/auth/signup.html">Jisajili hapa</a></p>
      <p style="margin-top:8px;"><a href="/auth/forgot-password.html">Nimesahau nenosiri</a></p>
    </div>
  </div>

  <!-- JAVASCRIPT - Inatumia Supabase Auth Halisi -->
  <script type="module">
    import { supabase } from '/assets/js/supabase.js';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const msgBox = document.getElementById('messageBox');

    function showMessage(type, text) {
      msgBox.className = `msg ${type}`;
      msgBox.textContent = text;
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      msgBox.className = 'msg';
      msgBox.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showMessage('error', 'Tafadhali jaza barua pepe na nenosiri.');
        return;
      }

      // Zima kitufe
      loginBtn.disabled = true;
      loginBtn.textContent = '⏳ Inaingiza...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          console.error('Login error:', error);
          showMessage('error', error.message || 'Email au nenosiri si sahihi. Jaribu tena.');
          return;
        }

        if (data && data.user) {
          showMessage('success', '✅ Umefanikiwa kuingia! Unaelekezwa kwenye dashboard...');
          
          // Hifadhi session (hiari)
          localStorage.setItem('dvary_user_id', data.user.id);
          localStorage.setItem('dvary_user_email', data.user.email);

          // Elekeza kwenye dashboard baada ya sekunde 1.5
          setTimeout(() => {
            window.location.href = '/dashboard/';
          }, 1500);
        }

      } catch (err) {
        console.error('Unexpected error:', err);
        showMessage('error', 'Kuna hitilafu ya mfumo. Jaribu tena baada ya muda.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '🔑 Ingia';
      }
    });
  </script>
</body>
</html>
